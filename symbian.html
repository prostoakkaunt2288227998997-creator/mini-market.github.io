<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Symbian — Mini Market</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body bgcolor="#1a1a1a" text="#ffffff" style="margin: 0; padding: 10px; font-family: Arial, Helvetica, sans-serif;">

    <!-- Логотип -->
    <div id="logoContainer" style="padding: 15px 20px; display: flex; align-items: center; flex-wrap: wrap; max-width: 100%; box-sizing: border-box; background-size: cover; background-position: center; min-height: 80px;">
        <img src="https://i.postimg.cc/VshcJLNC/Bez-nazvania628-20260906003745.png" alt="Логотип" width="50" height="50" style="vertical-align: middle; flex-shrink: 0;">
        <h1 style="color: #ffffff; display: inline; margin-left: 10px; font-size: clamp(18px, 5vw, 32px); text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">Mini Market</h1>
    </div>

    <p style="color: #cccccc; margin-top: 15px; font-size: clamp(14px, 2.5vw, 18px);">Приложения для Symbian</p>

    <hr color="#444444">

    <!-- Вкладки -->
    <div style="display: flex; flex-wrap: wrap; gap: 5px; margin: 15px 0;">
        <a href="index.html" style="background-color: #444444; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: clamp(14px, 2vw, 16px);">Главная</a>
        <a href="games.html" style="background-color: #444444; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: clamp(14px, 2vw, 16px);">Игры</a>
        <a href="symbian.html" style="background-color: #2d5a27; color: #ffffff; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: clamp(14px, 2vw, 16px);">Symbian</a>
    </div>

    <hr color="#444444">

    <!-- Подвкладки Symbian -->
    <div style="display: flex; flex-wrap: wrap; gap: 5px; margin: 15px 0;">
        <a href="symbian.html" style="background-color: #2d5a27; color: #ffffff; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-size: clamp(12px, 1.5vw, 14px);">Приложения</a>
        <a href="symbian-games.html" style="background-color: #444444; color: #ffffff; padding: 8px 16px; text-decoration: none; border-radius: 5px; font-size: clamp(12px, 1.5vw, 14px);">Игры</a>
    </div>

    <hr color="#444444">

    <h2 style="color: #ffffff;">Приложения для Symbian</h2>

    <div id="symbian-apps-list">
        <p style="color: #888888;">Загрузка приложений...</p>
    </div>

    <hr color="#444444">
    <p style="color: #888888; text-align: center;">© 2026-2027 Mini Market</p>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2HwGgkM9bLjCdxjR3t8jqTzq_-J3sVwQ",
            authDomain: "mini-market-c1cc4.firebaseapp.com",
            databaseURL: "https://mini-market-c1cc4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mini-market-c1cc4",
            storageBucket: "mini-market-c1cc4.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadLogoBackground() {
            const bgRef = database.ref('settings/logoBackground');
            bgRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const logoContainer = document.getElementById('logoContainer');
                if (data && data.gifUrl) {
                    logoContainer.style.backgroundImage = `url('${data.gifUrl}')`;
                    logoContainer.style.backgroundColor = 'transparent';
                } else {
                    logoContainer.style.backgroundColor = '#2d5a27';
                    logoContainer.style.backgroundImage = 'none';
                }
            });
        }

        function loadSymbianApps() {
            const appsRef = database.ref('symbian/apps');
            appsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('symbian-apps-list');
                if (data) {
                    let html = '<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;">';
                    for (let key in data) {
                        const app = data[key];
                        app.id = 'symbian_apps_' + key;
                        html += `
                            <a href="app.html?id=${app.id}" style="text-decoration: none; color: inherit; display: block;">
                                <div style="background-color: #222222; padding: 10px; border-radius: 5px; border: 1px solid #444444; text-align: center;">
                                    <h3 style="color: #ffffff; margin: 0 0 5px 0; font-size: clamp(12px, 2vw, 16px);">${app.name}</h3>
                                    <p style="margin: 5px 0;"><img src="${app.icon}" width="48" height="48"></p>
                                    <p style="font-size: clamp(10px, 1.5vw, 13px);">Symbian: ${app.minVersion || 'S60v3'}</p>
                                    <button style="background-color: #444444; color: #ffffff; border: 1px solid #666666; padding: 5px 10px; width: 100%; cursor: pointer;">Подробнее</button>
                                </div>
                            </a>
                        `;
                    }
                    html += '</div>';
                    list.innerHTML = html;
                } else {
                    list.innerHTML = '<p style="color: #888888;">Приложений для Symbian не найдено</p>';
                }
            });
        }

        loadLogoBackground();
        loadSymbianApps();
    </script>

</body>
</html>
