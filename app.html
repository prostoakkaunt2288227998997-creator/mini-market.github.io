<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Приложение</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body bgcolor="#1a1a1a" text="#ffffff" style="margin: 0; padding: 20px; font-family: Arial, sans-serif;">

    <a href="javascript:history.back()" style="color: #aaff00; font-size: 18px; text-decoration: none; display: inline-block; margin-bottom: 20px;">← Назад</a>

    <div id="app-detail" style="max-width: 600px; margin: 0 auto; background-color: #222222; padding: 30px; border-radius: 10px; border: 1px solid #444444; text-align: center;">
        <p style="color: #888888;">Загрузка...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA2HwGgkM9bLjCdxjR3t8jqTzq_-J3sVwQ",
            authDomain: "mini-market-c1cc4.firebaseapp.com",
            databaseURL: "https://mini-market-c1cc4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "mini-market-c1cc4",
            storageBucket: "mini-market-c1cc4.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function getParamsFromURL() {
            const params = new URLSearchParams(window.location.search);
            return {
                section: params.get('section'),
                id: params.get('id')
            };
        }

        function loadAppDetail() {
            const { section, id } = getParamsFromURL();
            const detailDiv = document.getElementById('app-detail');

            if (!section || !id) {
                detailDiv.innerHTML = '<p style="color: #ff6666; font-size: 18px;">❌ Неверная ссылка</p>';
                return;
            }

            const appRef = database.ref('applications/' + id);
            
            appRef.once('value', (snapshot) => {
                const app = snapshot.val();

                if (app) {
                    // Проверяем, что appSection совпадает с переданным section
                    if (app.appSection != section) {
                        detailDiv.innerHTML = `
                            <p style="color: #ff6666; font-size: 18px;">❌ Приложение не найдено в этом разделе</p>
                            <p style="color: #888888; font-size: 14px;">ID: ${id} | Ожидался раздел: ${section} | Фактический: ${app.appSection}</p>
                        `;
                        return;
                    }

                    document.title = app.name + ' — Mini Market';
                    
                    detailDiv.innerHTML = `
                        <h1 style="color: #ffffff; font-size: 28px; margin-top: 0;">${app.name}</h1>
                        <div style="background-color: #1a1a1a; padding: 20px; border-radius: 8px; margin: 15px 0;">
                            <img src="${app.icon}" alt="Иконка" width="128" height="128" style="display: block; margin: 0 auto;">
                        </div>
                        <p style="font-size: 16px; color: #cccccc; margin: 10px 0;">
                            <strong>Минимальная версия:</strong> ${app.minVersion || 'Не указана'}
                        </p>
                        <a href="${app.downloadLink}" target="_blank" style="display: inline-block; width: 100%;">
                            <button style="background-color: #2d5a27; color: #ffffff; border: none; padding: 15px 40px; font-size: 18px; cursor: pointer; border-radius: 5px; width: 100%; font-weight: bold;">📥 Скачать</button>
                        </a>
                    `;
                } else {
                    detailDiv.innerHTML = `
                        <p style="color: #ff6666; font-size: 18px;">❌ Приложение не найдено</p>
                        <p style="color: #888888; font-size: 14px;">ID: ${id}</p>
                    `;
                }
            });
        }

        loadAppDetail();
    </script>

</body>
</html>
